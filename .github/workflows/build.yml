name: Build SA-MP 2.10

on:
  workflow_dispatch:
  push:
    branches:
      - Xe

permissions:
  contents: read

jobs:
  build:
    name: Build SA-MP 2.10
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Xe source
        uses: actions/checkout@v4
        with:
          ref: Xe
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;26.2.11394342"
          sdkmanager "cmake;3.22.1"

      - name: Create temporary build keystore
        run: |
          mkdir -p keys

          keytool -genkeypair \
            -v \
            -keystore keys/new.jks \
            -storepass 123123 \
            -keypass 123123 \
            -alias key0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SA-MP Mobile, OU=Development, O=MySAMP, L=Unknown, ST=Unknown, C=IN"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Clean project
        run: ./gradlew clean --stacktrace

      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Show generated APK
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SA-MP-2.10-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
